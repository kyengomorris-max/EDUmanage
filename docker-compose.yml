services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edumanage
      POSTGRES_PASSWORD: edumanage
      POSTGRES_DB: edumanage
    ports:
      - "5432:5432"
    volumes:
      - edumanage_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumanage -d edumanage"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  edumanage_pg:
